[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "crates/helper", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zstd = "0.13"
rusqlite = { version = "0.32", features = ["bundled"] }
filetime = "0.2"
getrandom = "0.2"
clap = { version = "4", features = ["derive", "env"] }
tempfile = "3"

# Compression and checksums are far too slow unoptimized, even in development builds.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
